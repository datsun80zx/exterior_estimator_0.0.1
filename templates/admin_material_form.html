{{define "title"}}{{if .IsNew}}Add Material{{else}}Edit Material{{end}}{{end}}
{{define "content"}}
<div class="admin">
    <h1>{{if .IsNew}}Add Material{{else}}Edit Material{{end}}</h1>

    <form action="/admin/materials" method="POST" hx-post="/admin/materials" class="material-form">

        {{if not .IsNew}}
        <input type="hidden" name="id" value="{{.Material.ID}}">
        {{end}}

        <fieldset>
            <legend>Material Details</legend>

            <div class="form-row">
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" required>
                        <option value="roofing" {{if eq (printf "%s" .Material.Category) "roofing" }}selected{{end}}>
                            Roofing</option>
                        <option value="siding" {{if eq (printf "%s" .Material.Category) "siding" }}selected{{end}}>
                            Siding</option>
                        <option value="gutters" {{if eq (printf "%s" .Material.Category) "gutters" }}selected{{end}}>
                            Gutters</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="brand">Brand</label>
                    <input type="text" id="brand" name="brand" value="{{.Material.Brand}}"
                        placeholder="e.g. Owens Corning">
                </div>
                <div class="form-group">
                    <label for="product_line">Product Line</label>
                    <input type="text" id="product_line" name="product_line" value="{{.Material.ProductLine}}"
                        placeholder="e.g. Duration">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group wide">
                    <label for="name">Material Name</label>
                    <input type="text" id="name" name="name" value="{{.Material.Name}}" required
                        placeholder="e.g. Duration Shingles">
                </div>
                <div class="form-group">
                    <label for="unit">Unit</label>
                    <select id="unit" name="unit" required>
                        <option value="bundle" {{if eq .Material.Unit "bundle" }}selected{{end}}>Bundle</option>
                        <option value="roll" {{if eq .Material.Unit "roll" }}selected{{end}}>Roll</option>
                        <option value="piece" {{if eq .Material.Unit "piece" }}selected{{end}}>Piece</option>
                        <option value="box" {{if eq .Material.Unit "box" }}selected{{end}}>Box</option>
                        <option value="tube" {{if eq .Material.Unit "tube" }}selected{{end}}>Tube</option>
                        <option value="linear_ft" {{if eq .Material.Unit "linear_ft" }}selected{{end}}>Linear Ft
                        </option>
                        <option value="sq_ft" {{if eq .Material.Unit "sq_ft" }}selected{{end}}>Sq Ft</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="coverage_per_unit">Coverage Per Unit</label>
                    <input type="number" id="coverage_per_unit" name="coverage_per_unit"
                        value="{{.Material.CoveragePerUnit}}" step="0.1" min="0">
                    <small>sq ft or linear ft per unit</small>
                </div>
                <div class="form-group">
                    <label for="cost_per_unit">Your Cost (per unit)</label>
                    <input type="number" id="cost_per_unit" name="cost_per_unit" value="{{printf " %.2f"
                        .Material.CostPerUnit}}" step="0.01" min="0">
                </div>
                <div class="form-group">
                    <label for="price_per_unit">Sell Price (per unit)</label>
                    <input type="number" id="price_per_unit" name="price_per_unit" value="{{printf " %.2f"
                        .Material.PricePerUnit}}" step="0.01" min="0">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>
                        <input type="checkbox" name="is_active" {{if .Material.IsActive}}checked{{end}}>
                        Active
                    </label>
                </div>
            </div>
        </fieldset>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Material</button>
            <a href="/admin/materials" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{{end}}
